apiVersion: apps/v1
kind: Deployment
metadata:
  name: vclaw-platform
  labels:
    app: vclaw-platform
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vclaw-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vclaw-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vclaw-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: vclaw
          image: vclaw/platform:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: vclaw-secrets
            - configMapRef:
                name: vclaw-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: vclaw-platform-svc
spec:
  selector:
    app: vclaw-platform
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vclaw-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vclaw-platform
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vclaw-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vclaw-platform
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
