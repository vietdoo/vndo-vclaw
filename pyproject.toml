[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vclaw"
version = "0.1.0"
description = "Vclaw AI Agent Orchestration Platform"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<25",
    "opentelemetry-api>=1.23,<2",
    "opentelemetry-sdk>=1.23,<2",
    "opentelemetry-instrumentation-aiohttp-client>=0.44b0",
    "aiohttp>=3.9,<4",
    "aiogram>=3.4,<4",
    "redis[hiredis]>=5.0,<6",
    "nats-py>=2.7,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.27,<1",
    "starlette>=0.36,<1",
    "tenacity>=8.2,<9",
    "python-ulid>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.entry-points."vclaw.agents"]
task_management = "vclaw.agents.builtin.task_management:TaskManagementAgent"
public_service = "vclaw.agents.builtin.public_service:PublicServiceAgent"
browser = "vclaw.agents.builtin.browser:BrowserAgent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
